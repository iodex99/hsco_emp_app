<h2 style="margin-top:12px;font-size:18px">{{ {403:'You don\'t have access to this page',404:'Not found',409:'This month is locked'}.get(code, 'Something went wrong') }}</h2>

<div class="row" style="justify-content:center;margin-top:18px"><a class="btn sec" href="javascript:history.back()">Go back</a><a class="btn" href="/">Overview</a></div>
</div></div></div></body></html>
